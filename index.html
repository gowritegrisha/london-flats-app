<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>London flats</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=202610152030">
</head><body>
<header id="hdr"><div id="fhead"><h1>🏠 London flats <span id="cnt" class="cnt"></span></h1>
<div class="ctl"><span class="lbl">Filter:</span><div class="row" id="filters"></div></div>
<div class="ctl"><span class="lbl">Sort:</span><select id="sort"><option value="score" selected>Score ↓</option><option value="date">Newest</option><option value="price">Price ↑</option><option value="size">Size ↓</option></select><span id="hidt"></span></div></div></header>
<main id="list"></main>
<main id="vlist" style="display:none"></main>
<main id="rlist" style="display:none"></main>
<nav id="tabs" role="tablist">
<button type="button" role="tab" data-tab="flats" id="tabF"><span class="ic">🏠</span>Flats</button>
<button type="button" role="tab" data-tab="viewings" id="tabV"><span class="ic">📅</span>Viewings</button>
<button type="button" role="tab" data-tab="replies" id="tabR"><span class="ic">✉️</span>Enquiries</button>
</nav>
<div id="dlg"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b id="dt"></b><button class="b s" onclick="closeD()">✕</button></div>
<p class="hint1">Edit if you like, then tap <b>Send</b>. The assistant sends it right away via Rightmove as Maria; its status will appear under <b>✉️ Enquiries</b>.</p>
<textarea id="txt"></textarea>
<button class="b big full" onclick="sendAct('confirm')">📨 Send</button>
<div class="acts"><button class="b s" onclick="toggleRegen()">🔄 Rewrite…</button><button class="b s" onclick="copyT()">📋 Copy</button><button class="b s" onclick="openL()">Rightmove ↗</button></div>
<div id="regen" style="display:none"><textarea id="cmt" style="min-height:70px" placeholder="What should change? e.g. shorter, mention parking, ask about bills"></textarea>
<div class="acts"><button class="b" onclick="sendAct('regenerate')">Ask assistant to rewrite</button></div></div>
<p id="sdhint" style="color:#888;font-size:12px;display:none"></p></div>
<button id="sync" class="b" style="display:none" onclick="syncR()"></button>
<div class="toast" id="toast"></div>
<script src="app.js?v=202610152030"></script>
</body></html>
