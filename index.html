<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Квартиры в Лондоне</title>
<script>(function(){var K='dbglog',P=[];try{P=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}var prev=P.slice(-12),cur=[],t0=Date.now();
var show=(location.hash+location.search).toLowerCase().indexOf('debug')>=0;
function save(){try{localStorage.setItem(K,JSON.stringify(P.slice(-60)))}catch(e){}}
function paint(){if(!show)return;var d=document.getElementById('dbgp');if(!d){if(!document.body)return;d=document.createElement('pre');d.id='dbgp';d.style.cssText='position:fixed;left:0;right:0;bottom:64px;z-index:99998;margin:0;padding:4px 6px;background:rgba(0,0,0,.75);color:#0f0;font:9px/1.25 monospace;white-space:pre-wrap;max-height:30vh;overflow:auto;pointer-events:auto';d.onclick=function(){d.style.display='none'};document.body.appendChild(d)}d.style.display='';d.textContent='[prev session]\n'+prev.join('\n')+'\n[now v4.6]\n'+cur.join('\n')}
window.DBG=function(m){var s=new Date().toISOString().slice(11,19)+' +'+(Date.now()-t0)+'ms '+m;cur.push(s);P.push(s);save();paint()};
DBG('---- boot '+location.pathname+' hash='+(location.hash||'').slice(0,20)+' dbg='+show);
document.addEventListener('DOMContentLoaded',function(){DBG('html parsed');paint();var taps=0,last=0;var hdr=document.getElementById('hdr');if(hdr)hdr.addEventListener('click',function(){var n=Date.now();if(n-last>2000)taps=0;last=n;if(++taps>=5){taps=0;show=true;DBG('debug panel unlocked');paint()}})});
addEventListener('pagehide',function(){DBG('pagehide')});addEventListener('beforeunload',function(){DBG('beforeunload')});
document.addEventListener('visibilitychange',function(){DBG('visibility '+document.visibilityState)});
addEventListener('error',function(e){DBG('ERR '+e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno)});
addEventListener('unhandledrejection',function(e){DBG('REJ '+(e.reason&&e.reason.message||e.reason))});
})();</script>
<script>(function(){function show(m){try{var d=document.getElementById('errbox');if(!d){d=document.createElement('pre');d.id='errbox';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:12px;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;max-height:60vh;overflow:auto';(document.body||document.documentElement).appendChild(d)}d.textContent+='⚠️ '+m+'\n';var l=document.getElementById('boot');if(l)l.remove()}catch(e){}}window.onerror=function(m,src,ln,col,e){show(m+' @'+(src||'').split('/').pop()+':'+ln+':'+col+(e&&e.stack?'\n'+e.stack:''))};window.addEventListener('unhandledrejection',function(e){var r=e.reason;show('Promise: '+(r&&(r.stack||r.message)||r))});setTimeout(function(){if(document.getElementById('boot'))show('App did not render within 15s')},15000)})();</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=v4.6">
</head><body>
<header id="hdr"><div id="fhead"><h1>🏠 Квартиры <span id="cnt" class="cnt"></span></h1>
<div class="ctl"><div class="row" id="filters"></div></div>
<div class="ctl"><span class="lbl">Сортировка</span><select id="sort"><option value="score" selected>По оценке</option><option value="date">Новые</option><option value="price">Дешевле</option><option value="size">Больше</option><option value="commute">Ближе к офису</option></select><span id="hidt"></span></div></div></header>
<main id="list"><div id="boot" style="padding:40px 16px;text-align:center;color:#888;background:transparent">⏳ Загрузка…</div></main>
<main id="vlist" style="display:none"></main>
<main id="rlist" style="display:none"></main>
<nav id="tabs" role="tablist">
<button type="button" role="tab" data-tab="flats" id="tabF"><span class="ic">🏠</span>Квартиры</button>
<button type="button" role="tab" data-tab="viewings" id="tabV"><span class="ic">📅</span>Просмотры</button>
<button type="button" role="tab" data-tab="replies" id="tabR"><span class="ic">✉️</span>Запросы<i id="ubadge"></i></button>
</nav>
<div id="dlg"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b id="dt"></b><button class="b s" onclick="closeD()">✕</button></div>
<p class="hint1">Поправьте текст и нажмите <b>Отправить</b>. Ассистент отправит запрос от имени Маши; статус появится во вкладке <b>✉️ Запросы</b>.</p>
<textarea id="txt"></textarea>
<button class="b big full" onclick="sendAct('confirm')">📨 Отправить</button>
<div class="acts"><button class="b s" onclick="toggleRegen()">🔄 Переписать…</button><button class="b s" onclick="copyT()">📋 Копировать</button><button class="b s" onclick="openL()">Rightmove ↗</button></div>
<div id="regen" style="display:none"><textarea id="cmt" style="min-height:70px" placeholder="Что изменить? Например: короче, спросить про счета"></textarea>
<div class="acts"><button class="b" onclick="sendAct('regenerate')">Попросить ассистента переписать</button></div></div>
<p id="sdhint" style="color:#888;font-size:12px;display:none"></p></div>
<button id="sync" class="b" style="display:none" onclick="syncR()"></button>
<div id="sheet" onclick="if(event.target===this)sheetClose()"><div class="sbox"><div class="grab"></div><div class="sbody"></div></div></div>
<div class="toast" id="toast"></div>

</body></html>
